# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Both re-verified working with native-gradle-plugin 1.1.8 (no config-cache
# problems reported, cache entries store/reuse cleanly around nativeCompile
# and nativeQuickCompile) -- free wins for the Kotlin-compile/dependency
# work around the native-image step; they don't speed up native-image
# itself, which is a separate out-of-process tool invocation.
org.gradle.caching=true
org.gradle.configuration-cache=true

org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/Library/Java/JavaVirtualMachines/graalvm-25.jdk/Contents/Home

# Jarlet's own version -- single source of truth for app/'s bundled VERSION
# resource (see app/build.gradle.kts's processResources filtering and
# me.devsnox.jarlet.config.JarletVersion). Kept separate from src/VERSION,
# which is the bash prototype's own file and is not read by the Kotlin app.
jarletVersionPrefix=v
jarletVersionMajor=0
jarletVersionMinor=5
jarletVersionPatch=3
jarletVersionStage=ALPHA
jarletVersionRoll=2