org.gradle.configuration-cache=false


org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/Library/Java/JavaVirtualMachines/graalvm-25.jdk/Contents/Home

# Jarlet's own version -- single source of truth for app/'s bundled VERSION
# resource (see app/build.gradle.kts's processResources filtering and
# me.devsnox.jarlet.config.JarletVersion). Kept separate from src/VERSION,
# which is the bash prototype's own file and is not read by the Kotlin app.
jarletVersionPrefix=v
jarletVersionMajor=0
jarletVersionMinor=2
jarletVersionPatch=0
jarletVersionStage=ALPHA
jarletVersionRoll=0