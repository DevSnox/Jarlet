# jarlet.toml — example server template
#
# A template describes a reusable server definition: Paper/Minecraft
# settings plus the plugin set that comes with it. The instance name
# ("what is this particular server called") is NOT stored here — it is
# supplied as a CLI argument to setup.sh/start.sh, so the same template
# can be reused to create multiple differently-named servers.
#
# See prototyping/documentation/concepts/server-templating for the full
# concept and the per-source plugin field meanings (source / id / policy).

[template]
name = "default"
description = "Default Jarlet server template"

[server]
package = "paper"
minecraft_version = "26.2"
memory = "2G"
port = 25565
online_mode = true

[[plugins]]
source = "hangar"
id = "Essentials"
policy = { track = "channel", channel = "Release" }
