name: Build native release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-native:
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG"

      - name: Test and build native executable
        run: |
          ./gradlew \
            --no-daemon \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            clean \
            :app:test \
            :app:nativeCompile

      - name: Prepare release assets
        run: |
          binary="app/build/native/nativeCompile/jarlet"
          asset="jarlet-${RELEASE_TAG}-linux-x86_64"

          if [[ ! -f "$binary" ]]; then
            echo "Native executable not found: $binary"
            exit 1
          fi

          chmod +x "$binary"
          cp "$binary" "$asset"
          sha256sum "$asset" > "${asset}.sha256"

      - name: Upload native executable to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="jarlet-${RELEASE_TAG}-linux-x86_64"

          gh release upload "$RELEASE_TAG" \
            "$asset" \
            "${asset}.sha256" \
            --clobber
