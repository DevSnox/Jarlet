name: Build native release

on:
  release:
    types:
      - published
      - edited

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-native:
    runs-on:
      - self-hosted
      - linux
      - x64

    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up GraalVM 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - name: Verify runner dependencies
        shell: bash
        run: |
          set -euo pipefail

          command -v git
          command -v java
          command -v gh
          command -v sha256sum

          java --version
          gh --version

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Verify GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --console=plain \
            --warning-mode=all \
            clean \
            :app:test

      - name: Build native executable
        shell: bash
        run: |
          set +e

          log_file="$RUNNER_TEMP/native-image-build.log"

          ./gradlew \
            --no-daemon \
            --console=plain \
            --info \
            --warning-mode=all \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            :app:nativeCompile \
            2>&1 | tee "$log_file"

          build_status=${PIPESTATUS[0]}

          if [[ "$build_status" -ne 0 ]]; then
            echo "::group::Native Image failure context"

            grep -nE -C 25 \
              'Error:|Caused by:|Exception|OutOfMemory|UnsupportedFeature|Failed generating|Killed process|oom' \
              "$log_file" \
              || tail -n 400 "$log_file"

            echo "::endgroup::"
            echo "::error title=Native Image build failed::Gradle exited with status ${build_status}"
          fi

          exit "$build_status"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          binary="app/build/native/nativeCompile/jarlet"
          safe_tag="${RELEASE_TAG//\//-}"
          asset="jarlet-${safe_tag}-linux-x86_64"

          if [[ ! -f "$binary" ]]; then
            echo "::error title=Missing native executable::Expected file: ${binary}"
            exit 1
          fi

          chmod +x "$binary"
          cp "$binary" "$asset"
          sha256sum "$asset" > "${asset}.sha256"

          echo "ASSET_NAME=$asset" >> "$GITHUB_ENV"

          ls -lh "$asset" "${asset}.sha256"
          cat "${asset}.sha256"

      - name: Upload native executable to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "$ASSET_NAME" \
            "${ASSET_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
