name: Build native release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-native:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up GraalVM 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - name: Test and build
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --console=plain \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            clean \
            :app:test \
            :app:nativeCompile

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          binary="app/build/native/nativeCompile/jarlet"
          safe_tag="${RELEASE_TAG//\//-}"
          asset="jarlet-${safe_tag}-linux-x86_64"

          test -f "$binary"
          cp "$binary" "$asset"
          chmod +x "$asset"
          sha256sum "$asset" > "${asset}.sha256"

          gh release upload "$RELEASE_TAG" \
            "$asset" \
            "${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
