# jarlet-sys.conf
PAPERMC_API=https://fill.papermc.io/v3
HANGAR_API=https://hangar.papermc.io/api/v1
SPIGET_API=https://api.spiget.org/v2
GITHUB_API=https://api.github.com
PROJECT_NAME=jarlet
REPO_URL=https://github.com/DevSnox/jarlet
INSTANCES_DIR_DEFAULT=$HOME/.jarlet/instances
ENVIRONMENTS_FILENAME=environments.toml
TOPOLOGY_FILENAME=topology.toml
TEMPLATE_FILENAME=jarlet.toml
STOP_TIMEOUT_SECONDS=60
STARTUP_CHECK_DELAY_SECONDS=2
PLUGIN_LIST_PAGE_SIZE=10
GITHUB_ASSET_TIEBREAK_FIELD=download_count
TRUSTED_SOURCES_FILENAME=jarlet-trusted-sources.conf
GITHUB_RELEASES_LIST_PER_PAGE=100
GITHUB_RELEASES_LIST_MAX_PAGES=5
SPIGET_VERSION_LIST_PAGE_SIZE=100
SPIGET_VERSION_LIST_MAX_PAGES=5
HANGAR_VERSION_LIST_LIMIT=100
HANGAR_VERSION_LIST_MAX_PAGES=5
ENV_FILE_PATH=/etc/jarlet/jarlet.env
SELF_UPDATE_REPO=DevSnox/Jarlet
SELF_UPDATE_INSTALL_URL=https://raw.githubusercontent.com/DevSnox/Jarlet/main/install.sh
SELF_UPDATE_OS=linux
SELF_UPDATE_ARCH=x86_64
SELF_UPDATE_CHECK_INTERVAL_MINUTES=15
SELF_UPDATE_HTTP_TIMEOUT_SECONDS=3
SELF_UPDATE_JOIN_TIMEOUT_SECONDS=2
